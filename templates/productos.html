{% extends "base.html" %}

{% block contenido %}
<h2>Productos</h2>

<table class="table">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Categoría</th>
        <th>Precio por kg</th>
        <th>Stock (kg)</th>
        <th></th>
    </tr>
    {% for p in productos %}
    <tr>
        <td>{{ p["id"] }}</td>
        <td>{{ p["nombre"] }}</td>
        <td>{{ p["categoria"] }}</td>
        <td>₡{{ p["precio"] }}</td>
        <td>{{ p["stock"] }}</td>
        <td>
            <a href="/editar/{{ p['id'] }}">Modificar</a>
            <form action="/eliminar/{{ p['id'] }}" method="POST" style="display:inline"
                  onsubmit="return confirm('¿Seguro que quiere eliminar este producto?')">
                <button type="submit">Eliminar</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
