<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calinga</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fff5f0; }
        h1 { background-color: #b71c1c; color: white; padding: 15px; border-radius: 8px; }
        h2 { color: #b71c1c; }
        a { color: #b71c1c; font-weight: bold; }
        hr { border-color: #b71c1c; }
        th { background-color: #b71c1c !important; color: white !important; }
        button { background-color: #b71c1c; color: white; border: none; padding: 5px 12px; border-radius: 5px; }
        button:hover { background-color: #7f0000; }
        input, select { border: 1px solid #b71c1c; border-radius: 4px; padding: 3px; }
    </style>
</head>
<body>
    <div class="container mt-3">
        <h1>Calinga</h1>
        <a href="/">Inicio</a> |
        <a href="/productos">Ver productos</a> |
        <a href="/agregar">Agregar producto</a>
        <hr>

        {% for mensaje in get_flashed_messages() %}
            <p class="text-success">{{ mensaje }}</p>
        {% endfor %}

        {% block contenido %}{% endblock %}
    </div>
</body>
</html>
